name: Windows build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: windows-x86_64

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Run Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Package executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/keytide.exe dist/keytide-windows-x86_64.exe
          Compress-Archive -Path dist/keytide-windows-x86_64.exe -DestinationPath dist/keytide-windows-x86_64.zip
          $hash = (Get-FileHash dist/keytide-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  keytide-windows-x86_64.zip" | Set-Content -NoNewline dist/keytide-windows-x86_64.zip.sha256

      - name: Attest Windows archive provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/keytide-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keytide-windows-x86_64
          path: |
            dist/keytide-windows-x86_64.zip
            dist/keytide-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
